<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="1felev/feladat_01.css">
    <title>Soros eredő - MagyarB</title>
    <style>
    label {
        margin-top: 10px;
    }
    input[type="number"] {
        padding: 5px;
        margin: 5px 0;
        width: 100px;
    }
    input[type="submit"] {
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
    }
    .result {
        margin-top: 20px;
        font-size: 1.2em;
    }
    div{
        background-color: #46040a57;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-top: 20px;}

    </style>
    
</head>
<body>
    <h1><a href="index.html" style="text-align: center;">[Főoldal]</a>
        Magyar Botond 10.D - IKT 'feladat_01'
    </h1>
    
    <div>
        <form id="form">
            <label for="r1">Első ellenállás (Ohm):</label>
            <input type="number" id="r1" name="r1" step="any"><br><br>
        
            <label for="r2">Második ellenállás (Ohm):</label>
            <input type="number" id="r2" name="r2" step="any"><br><br>
        
            <label for="r3">Harmadik ellenállás (Ohm, opcionális):</label>
            <input type="number" id="r3" name="r3" step="any"><br><br>
        
            <label for="r4">Negyedik ellenállás (Ohm, opcionális):</label>
            <input type="number" id="r4" name="r4" step="any"><br><br>
        
            <label for="r5">Ötödik ellenállás (Ohm, opcionális):</label>
            <input type="number" id="r5" name="r5" step="any"><br><br>
            <input type="submit" value="Számítás">
        </form>
    </div>
        <div class="result" id="eredmeny"></div>
    

    <script>
 
        function szamol(szamok) {
            return szamok.reduce((sum, r) => sum + r, 0); 
        }


        document.getElementById('form').addEventListener('submit', function(event) {
            event.preventDefault(); 

  
            const r1 = parseFloat(document.getElementById('r1').value) || 0;
            const r2 = parseFloat(document.getElementById('r2').value) || 0;
            const r3 = parseFloat(document.getElementById('r3').value) || 0;
            const r4 = parseFloat(document.getElementById('r4').value) || 0;
            const r5 = parseFloat(document.getElementById('r5').value) || 0;
            const szamok = [r1, r2, r3, r4, r5].filter(r => r > 0); 

            if (szamok.length < 1) {
                alert('Adj meg legalább egy ellenállást!');
                return;
            }
            const eredmeny = szamol(szamok);
            document.getElementById('eredmeny').innerText = `A soros ellenállás eredője: ${eredmeny.toFixed(2)} Ohm`;
        });
    </script>
</body>
</html>
